        }

        .welcome-logo {
            width: 170px;
            height: 170px;
            border-radius: 18px;
            object-fit: contain;
            background: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            margin: 0 auto 16px auto;
            display: block;
        }
        .welcome-text { color: var(--primary); font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }

        .login-container h2 { color: var(--primary); margin-bottom: 5px; font-size: 1.4rem; }
        .login-container p { color: #6c757d; margin-bottom: 30px; font-size: 0.9rem; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #495057; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;}
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #ced4da;
            border-radius: 4px; font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); }

        .btn-login {
            width: 100%; background-color: var(--accent); color: white;
            padding: 12px; border: none; border-radius: 4px; font-size: 1rem;
            font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-login:hover { background-color: #004494; }

        .error-message { 
            color: #dc3545; background-color: #f8d7da; border: 1px solid #f5c6cb;
            padding: 10px; border-radius: 4px; font-size: 0.85rem; margin-top: 20px; display: none; 
        }
    </style>
</head>

        <h2>Sistema de Auditoría</h2>
        <p>Acceso seguro corporativo</p>

        <form id="loginForm" onsubmit="iniciarSesion(event)">
            <div class="input-group">
                <label for="usuario">ID de Usuario</label>
                <input type="text" id="usuario" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            
            <button type="submit" class="btn-login">Ingresar</button>
            <div id="error-msg" class="error-message">Credenciales incorrectas o usuario inactivo.</div>
        </form>
    </div>

    <script>
        // ── Configuración Supabase ─────────────────────────────────────────
        const SUPABASE_URL = 'https://rklqmqofnsaafcfwuoxf.supabase.co/functions/v1/api';

        async function apiPost(action, params = {}) {
            const res = await fetch(SUPABASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...params })
            });
            return res.json();
        }

        async function iniciarSesion(event) {
            event.preventDefault();

            const btnLogin = document.querySelector('.btn-login');
            const errorMsg = document.getElementById('error-msg');
            const usuario  = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;

            btnLogin.disabled = true;
            btnLogin.textContent = 'Verificando...';
            errorMsg.style.display = 'none';

            try {
                const r = await apiPost('login', { usuario, password });

                if (r && r.ok) {
                    // Guardar sesión en el mismo formato que usan los módulos
                    const sesion = {
                        username:     r.usuario,
                        usuario:      r.usuario,
                        nombre:       r.nombre || r.usuario,
                        rol:          r.rol,
                        token:        r.token,
                        herramientas: r.herramientas || []
                    };
                    sessionStorage.setItem('usuarioLogueado', JSON.stringify(sesion));
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = r && r.error ? r.error : 'Credenciales incorrectas o usuario inactivo.';
                    errorMsg.style.display = 'block';
                    setTimeout(() => errorMsg.style.display = 'none', 3500);
                }
            } catch (e) {
                errorMsg.textContent = 'Error de conexión. Verificá tu internet.';
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3500);
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Ingresar';
            }
        }

        // Si ya hay sesión activa, redirigir directamente
        if (sessionStorage.getItem('usuarioLogueado')) {
            window.location.href = 'index.html';
        }
    </script>
