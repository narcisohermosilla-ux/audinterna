<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Auditoría - Acceso Corporativo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d1620;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-box h2 {
            color: #1a252f;
            margin-bottom: 6px;
            font-size: 1.4rem;
            text-align: center;
        }
        .login-box p {
            color: #666;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #0056b3; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #004494; }
        .btn-login:disabled { background: #aaa; cursor: not-allowed; }
        .error-msg {
            display: none;
            margin-top: 14px;
            padding: 10px 14px;
            background: #fff0f0;
            border: 1px solid #f5c6c6;
            border-radius: 6px;
            color: #c0392b;
            font-size: 0.88rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sistema de Auditoría</h2>
        <p>Ingresá tus credenciales para continuar</p>

        <form id="loginForm">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario" autocomplete="off" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresá tu contraseña" required>

            <button type="submit" class="btn-login">Ingresar</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        var SUPA_URL = 'https://rklqmqofnsaafcfwuoxf.supabase.co/functions/v1/api';

        // Si ya hay sesion activa con token, ir directo al panel
        (function() {
            try {
                var s = sessionStorage.getItem('usuarioLogueado');
                if (s) {
                    var p = JSON.parse(s);
                    if (p && p.token) {
                        window.location.href = 'index.html';
                    }
                }
            } catch(e) {}
        })();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hacerLogin();
        });

        function hacerLogin() {
            var btn      = document.querySelector('.btn-login');
            var errorDiv = document.getElementById('errorMsg');
            var usuario  = document.getElementById('usuario').value.trim();
            var password = document.getElementById('password').value;

            errorDiv.style.display = 'none';

            if (!usuario || !password) {
                errorDiv.textContent = 'Ingresá usuario y contraseña.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verificando...';

            fetch(SUPA_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', usuario: usuario, password: password })
            })
            .then(function(res) { return res.json(); })
            .then(function(r) {
                if (r && r.ok && r.token) {
                    sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                        username:     r.usuario,
                        usuario:      r.usuario,
                        nombre:       r.nombre || r.usuario,
                        rol:          r.rol || 'auditor',
                        token:        r.token,
                        herramientas: r.herramientas || []
                    }));
                    window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = (r && r.error) ? r.error : 'Credenciales incorrectas o usuario inactivo.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Ingresar';
                }
            })
            .catch(function() {
                errorDiv.textContent = 'Error de conexión. Verificá tu internet.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            });
        }
    </script>
</body>
</html>
