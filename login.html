<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Auditoría</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1620}
.box{background:#fff;padding:42px;border-radius:12px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
h2{color:#1a252f;font-size:1.5rem;text-align:center;margin-bottom:6px}
.sub{color:#666;font-size:.85rem;text-align:center;margin-bottom:30px}
label{display:block;font-size:.75rem;font-weight:700;color:#444;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:7px;font-size:.95rem;margin-bottom:18px;outline:none;transition:border-color .2s}
input:focus{border-color:#0056b3}
.btn{width:100%;padding:13px;background:#0056b3;color:#fff;border:none;border-radius:7px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s}
.btn:hover{background:#004494}
.btn:disabled{background:#9ab;cursor:not-allowed}
.error{display:none;margin-top:14px;padding:11px 14px;background:#fff0f0;border:1px solid #f5c6c6;border-radius:7px;color:#c0392b;font-size:.88rem;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h2>Plataforma de Auditoría</h2>
  <p class="sub">Ingresá tus credenciales para continuar</p>
  <label>Usuario</label>
  <input type="text" id="u" placeholder="Tu usuario" autocomplete="off">
  <label>Contraseña</label>
  <input type="password" id="p" placeholder="Tu contraseña">
  <button class="btn" id="btn" onclick="login()">Ingresar</button>
  <div class="error" id="err"></div>
</div>
<script>
var API = 'https://rklqmqofnsaafcfwuoxf.supabase.co/functions/v1/api';

// Si ya hay sesion valida ir al panel
try{var _s=JSON.parse(sessionStorage.getItem('usuarioLogueado')||'null');if(_s&&_s.token)window.location.href='index.html';}catch(e){}

// Enter para loguear
document.getElementById('u').onkeydown=function(e){if(e.key==='Enter')login();}
document.getElementById('p').onkeydown=function(e){if(e.key==='Enter')login();}

function login(){
  var btn=document.getElementById('btn');
  var errDiv=document.getElementById('err');
  var u=document.getElementById('u').value.trim();
  var p=document.getElementById('p').value;
  errDiv.style.display='none';
  if(!u||!p){errDiv.textContent='Ingresá usuario y contraseña.';errDiv.style.display='block';return;}
  btn.disabled=true;btn.textContent='Verificando...';
  var xhr=new XMLHttpRequest();
  xhr.open('POST',API,true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    btn.disabled=false;btn.textContent='Ingresar';
    try{
      var r=JSON.parse(xhr.responseText);
      if(r&&r.ok&&r.token){
        sessionStorage.setItem('usuarioLogueado',JSON.stringify({
          username:r.usuario,usuario:r.usuario,nombre:r.nombre||r.usuario,
          rol:r.rol||'auditor',token:r.token,herramientas:r.herramientas||[]
        }));
        window.location.href='index.html';
      }else{
        errDiv.textContent=(r&&r.error)?r.error:'Credenciales incorrectas.';
        errDiv.style.display='block';
      }
    }catch(e){errDiv.textContent='Error al procesar respuesta.';errDiv.style.display='block';}
  };
  xhr.onerror=function(){btn.disabled=false;btn.textContent='Ingresar';errDiv.textContent='Error de conexión.';errDiv.style.display='block';};
  xhr.send(JSON.stringify({action:'login',usuario:u,password:p}));
}
</script>
</body>
</html>
