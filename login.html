<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Auditoría - Acceso Corporativo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d1620;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-box h2 { color: #1a252f; margin-bottom: 6px; font-size: 1.4rem; text-align: center; }
        .login-box p { color: #666; font-size: 0.85rem; text-align: center; margin-bottom: 28px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #444; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 0.95rem; margin-bottom: 18px; outline: none; }
        input:focus { border-color: #0056b3; }
        .btn-login { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #004494; }
        .btn-login:disabled { background: #aaa; cursor: not-allowed; }
        .error-msg { display: none; margin-top: 14px; padding: 10px 14px; background: #fff0f0; border: 1px solid #f5c6c6; border-radius: 6px; color: #c0392b; font-size: 0.88rem; text-align: center; }
        .cargando { display: none; margin-top: 14px; text-align: center; color: #0056b3; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Plataforma de Auditoría</h2>
        <p>Ingresá tus credenciales para continuar</p>

        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Tu usuario" autocomplete="off">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña">

        <button class="btn-login" id="btnLogin" onclick="hacerLogin()">Ingresar</button>
        <div class="error-msg" id="errorMsg"></div>
        <div class="cargando" id="cargando">Verificando credenciales...</div>
    </div>

    <script>
        var SUPA = 'https://rklqmqofnsaafcfwuoxf.supabase.co/functions/v1/api';

        // Si ya hay sesion valida, ir al panel
        try {
            var _s = JSON.parse(sessionStorage.getItem('usuarioLogueado') || 'null');
            if (_s && _s.token) { window.location.href = 'index.html'; }
        } catch(e) {}

        // Enter en los campos
        document.getElementById('usuario').addEventListener('keydown', function(e) { if (e.key === 'Enter') hacerLogin(); });
        document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') hacerLogin(); });

        function hacerLogin() {
            var btn      = document.getElementById('btnLogin');
            var errorDiv = document.getElementById('errorMsg');
            var cargando = document.getElementById('cargando');
            var usuario  = document.getElementById('usuario').value.trim();
            var password = document.getElementById('password').value;

            errorDiv.style.display = 'none';

            if (!usuario || !password) {
                errorDiv.textContent = 'Ingresá usuario y contraseña.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            cargando.style.display = 'block';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', SUPA, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = function() {
                cargando.style.display = 'none';
                btn.disabled = false;
                try {
                    var r = JSON.parse(xhr.responseText);
                    if (r && r.ok && r.token) {
                        sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                            username: r.usuario,
                            usuario:  r.usuario,
                            nombre:   r.nombre || r.usuario,
                            rol:      r.rol || 'auditor',
                            token:    r.token,
                            herramientas: r.herramientas || []
                        }));
                        window.location.href = 'index.html';
                    } else {
                        errorDiv.textContent = (r && r.error) ? r.error : 'Credenciales incorrectas.';
                        errorDiv.style.display = 'block';
                    }
                } catch(e) {
                    errorDiv.textContent = 'Error al procesar la respuesta del servidor.';
                    errorDiv.style.display = 'block';
                }
            };
            xhr.onerror = function() {
                cargando.style.display = 'none';
                btn.disabled = false;
                errorDiv.textContent = 'Error de conexion. Verificá tu internet.';
                errorDiv.style.display = 'block';
            };
            xhr.send(JSON.stringify({ action: 'login', usuario: usuario, password: password }));
        }
    </script>
</body>
</html>
