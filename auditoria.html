<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo...</title>
</head>
<body>
<script>
// Verificar sesión
var _s = null;
try { _s = JSON.parse(sessionStorage.getItem('usuarioLogueado') || 'null'); } catch(e) {}
if (!_s || !_s.token) {
    window.location.href = 'login.html';
} else {
    // Redirigir directo al sistema con el token en la URL
    window.location.href = 'audinterna_app.html?token=' + encodeURIComponent(_s.token) + '&volver=index.html';
}
</script>
</body>
</html>
